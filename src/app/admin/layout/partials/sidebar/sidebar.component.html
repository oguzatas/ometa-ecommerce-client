  <li class="nav-item nav-category">
    <span class="nav-link">{{ 'general.navigation' | translate }}</span>
  </li>
  <li
    *ngFor="let item of menuItems$ | async"
    class="nav-item menu-items"
    [class.active]="item.active"
  >
    <ng-container *ngIf="!item.sub">
      <a class="nav-link" [routerLink]="item.route">
        <span class="menu-icon">
          <i [class]="item.icon"></i>
        </span>
        <span class="menu-title">{{ item.title | translate }}</span>
      </a>
    </ng-container>

    <ng-container *ngIf="item.sub">
      <a class="nav-link" href="#" (click)="toggleCollapse($event, item)" [id]="item.title | hash">
        <span class="menu-icon">
          <i [class]="item.icon"></i>
        </span>
        <span class="menu-title">{{ item.title | translate }}</span>
        <i
          class="menu-arrow"
          [ngClass]="{
            'mdi mdi-chevron-double-down': !item.isCollapsed,
            'mdi mdi-chevron-right': item.isCollapsed
          }"
        ></i>
      </a>

      <div [@collapseAnimation]="item.isCollapsed" [attr.data-parent]="item.title | hash">
        <ul class="nav flex-column sub-menu">
          <li class="nav-item" *ngFor="let sub of item.sub">
            <a class="nav-link" [routerLink]="sub.route">{{ sub.title | translate }}</a>
          </li>
        </ul>
      </div>
    </ng-container>
  </li>
</ul>
